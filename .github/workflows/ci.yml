name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  turbostreamer:
    name: TurboStreamer Test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ruby-version:
          - "3.3"
          - "3.4"
          - "4.0"
        rails-version:
          - "8.0"
          - "8.1"
        encoder:
          - oj
          - wankel

    steps:
      - name: Install YAJL
        run: |
          wget 'https://github.com/lloyd/yajl/archive/refs/tags/2.1.0.tar.gz'
          tar -xvf '2.1.0.tar.gz'
          cd 'yajl-2.1.0' && ./configure && make && sudo make install
          sudo ldconfig

      - uses: actions/checkout@v7

      # Must run before ruby/setup-ruby so bundler-cache installs and caches
      # against the pinned Gemfile.
      - name: Pin Rails
        run: |
          echo "" >> Gemfile
          echo 'gem "rails", "~> ${{ matrix.rails-version }}.0"' >> Gemfile
          grep -q 'gem "rails", "~> ${{ matrix.rails-version }}.0"' Gemfile || { echo "ERROR: Rails pin not appended to Gemfile"; exit 1; }

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake test:${{ matrix.encoder }}
